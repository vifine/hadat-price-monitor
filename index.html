<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hadat — мониторинг цен</title>
<style>
  :root { --bg:#fafaf8; --fg:#1c1c1a; --muted:#77766f; --line:#e4e2db; --up:#b3261e; --down:#1e7b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#eceae4; --muted:#9a988f; --line:#2c2c29; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { padding:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 12px 0 0; }
  select, input { font:inherit; padding:6px 8px; background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  main { padding:16px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  .muted { color:var(--muted); }
  .note { margin:12px 16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Мониторинг цен</h1>
  <select id="market"><option value="">Все рынки</option></select>
  <input id="q" type="search" placeholder="SKU или название">
  <label class="muted"><input id="alerts" type="checkbox"> только изменения ≥ 5%</label>
</header>
<main>
  <table>
    <thead><tr>
      <th>SKU</th><th>Название</th><th>Рынок</th><th>Источник</th>
      <th class="num">Цена</th><th>Валюта</th><th class="num">Было</th><th class="num">Изменение</th><th>Обновлено</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<p class="note">Тестовые данные. Подключение к базе — следующий этап; интерфейс читает данные только через функцию loadData().</p>

<script>
// Единственная точка доступа к данным. На этапе подключения базы заменить тело функции.
async function loadData() {
  return [
    { sku:"112543", name:"Mock Product A 50 ml", market:"RU", source:"wb_own",        price:1490, currency:"RUB", prev:1590, at:"2026-10-19 05:00" },
    { sku:"112548", name:"Mock Product B 50 ml", market:"RU", source:"ozon_own",      price:1290, currency:"RUB", prev:1290, at:"2026-10-19 05:00" },
    { sku:"888793", name:"Mock Product C 70 ml", market:"RU", source:"goldapple",     price:2190, currency:"RUB", prev:2050, at:"2026-10-19 05:00" },
    { sku:"112543", name:"Mock Product A 50 ml", market:"US", source:"amazon_us",     price:24.95, currency:"USD", prev:24.95, at:"2026-10-19 05:00" },
    { sku:"888793", name:"Mock Product C 70 ml", market:"EU", source:"shopify_eu",    price:29.95, currency:"EUR", prev:31.50, at:"2026-10-19 05:00" }
  ];
}

const $ = (id) => document.getElementById(id);
let data = [];

function fmt(n, cur) {
  return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(n) + " " + cur;
}

function render() {
  const m = $("market").value, q = $("q").value.trim().toLowerCase(), onlyAlerts = $("alerts").checked;
  const rows = data
    .filter(r => !m || r.market === m)
    .filter(r => !q || r.sku.includes(q) || r.name.toLowerCase().includes(q))
    .map(r => ({ ...r, delta: r.prev ? (r.price - r.prev) / r.prev * 100 : 0 }))
    .filter(r => !onlyAlerts || Math.abs(r.delta) >= 5);
  $("rows").innerHTML = rows.map(r => {
    const cls = r.delta > 0 ? "up" : r.delta < 0 ? "down" : "muted";
    const sign = r.delta > 0 ? "+" : "";
    return `<tr>
      <td>${r.sku}</td><td>${r.name}</td><td>${r.market}</td><td class="muted">${r.source}</td>
      <td class="num">${r.price}</td><td>${r.currency}</td><td class="num muted">${r.prev}</td>
      <td class="num ${cls}">${sign}${r.delta.toFixed(1)}%</td><td class="muted">${r.at}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="9" class="muted">Нет строк по фильтру</td></tr>`;
}

async function init() {
  data = await loadData();
  const markets = [...new Set(data.map(r => r.market))].sort();
  $("market").insertAdjacentHTML("beforeend", markets.map(m => `<option>${m}</option>`).join(""));
  ["market", "q", "alerts"].forEach(id => $(id).addEventListener("input", render));
  render();
}
init();
</script>
</body>
</html>
