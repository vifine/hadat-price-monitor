<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hadat · Мониторинг цен</title>
<style>
:root{
  --page:#f6f6f4; --white:#fff; --text:#1f1f1f; --text2:#7a7a76; --line:#e4e4e0; --brand:#1f1f1f;
  --nodata:#e9e9e6; --radius:6px;
  font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-size:12px}
.wrap{padding:16px 20px;max-width:100%}
h1{font-size:16px;font-weight:600;margin:0 0 2px}
.sub{color:var(--text2);font-size:10px;margin-bottom:12px}
.demo{display:inline-block;background:#fff3cd;color:#7a5b00;border-radius:4px;padding:1px 6px;margin-left:6px;font-size:10px}

/* filter bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cluster{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{height:28px;width:260px;border:1px solid var(--line);background:var(--white);border-radius:var(--radius);padding:0 10px;font:inherit;font-size:12px}
.search:focus{outline:none;border-color:var(--text)}
.btn{height:28px;padding:0 10px;border:1px solid var(--line);background:var(--white);border-radius:var(--radius);font:inherit;font-size:12px;font-weight:500;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--text2)}
.btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.count{color:var(--text2);font-size:12px;padding:0 4px}
.reset{background:none;border:0;color:var(--text2);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0 4px}
.dd{position:relative}
.menu{position:absolute;top:32px;left:0;z-index:30;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(0,0,0,.08);padding:6px;min-width:200px;display:none}
.dd.open .menu{display:block}
.menu label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.menu label:hover{background:var(--page)}
.menu .hint{font-size:10px;color:var(--text2);padding:2px 8px 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);overflow:hidden}
.seg button{height:26px;border:0;background:none;font:inherit;font-size:12px;padding:0 10px;cursor:pointer;color:var(--text2)}
.seg button.active{background:var(--brand);color:#fff}
.range{display:none;gap:4px;align-items:center}
.range.show{display:inline-flex}
.range input{height:28px;border:1px solid var(--line);border-radius:var(--radius);padding:0 6px;font:inherit;font-size:11px;background:var(--white)}

/* table */
.scroll{overflow:auto;max-height:calc(100vh - 150px)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;background:none}
th,td{padding:0;height:29px;font-weight:400}
thead th{position:sticky;top:0;z-index:5;background:var(--page);height:36px;vertical-align:bottom;padding-bottom:4px}
thead tr.dates th{top:0}
td{border-bottom:1px solid var(--page)}
.c-prod{position:sticky;left:0;z-index:4;width:280px;min-width:280px;background:var(--white);text-align:left}
.c-rrp{position:sticky;left:280px;z-index:4;width:56px;min-width:56px;background:var(--white);text-align:right;font-size:9px;padding-right:6px}
thead .c-prod,thead .c-rrp{z-index:7;background:var(--page)}
.prod{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 4px;height:29px}
.sw{width:24px;height:24px;flex:none}
.pt{min-width:0;line-height:1.15}
.pt b{display:block;font-weight:500;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:228px}
.pt i{font-style:normal;font-size:8px;color:var(--text2)}
.ch{font-size:9px;font-weight:500;text-align:left;padding-left:4px;border-left:1px solid var(--text2)}
.dt{font-size:8px;color:var(--text2);text-align:center;cursor:pointer;user-select:none;white-space:nowrap}
.dt:hover{color:var(--text)}
.dt .arr{font-size:7px;margin-left:1px;opacity:.7}
.dt.first,.rrph.first{border-left:1px solid rgba(122,122,118,.6)}
td.cell{width:36px;min-width:36px;text-align:left;vertical-align:top;padding:2px 0 0 3px;font-size:9px;line-height:1.1;position:relative;cursor:default;overflow:hidden;white-space:nowrap}
td.cell.gstart{border-left:1px solid #fff}
td.cell s{display:block;font-size:7px;opacity:.75}
td.cell.none{background:var(--nodata);color:var(--text2)}
td.cell.eq{background:#fff;color:var(--text)}
.rrph{cursor:pointer;font-size:8px;color:var(--text2);text-align:right;padding-right:6px}
.empty{padding:40px;text-align:center;color:var(--text2)}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--brand);color:#fff;border-radius:6px;padding:6px 8px;font-size:11px;line-height:1.4;display:none;white-space:nowrap}
#tip .m{opacity:.7;font-size:10px}
.legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10px;color:var(--text2)}
.legend .bar2{width:160px;height:8px;border-radius:2px}
@media (prefers-color-scheme:dark){:root{}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Мониторинг цен <span class="demo" id="demoTag">демо-данные</span></h1>
  <div class="sub">Только собственные товары Hadat на маркетплейсах — цена относительно РРЦ</div>

  <div class="bar">
    <div class="cluster">
      <input id="q" class="search" placeholder="Поиск по названию или SKU" autocomplete="off">
      <div class="dd" id="ddSrc"><button class="btn" type="button" id="btnSrc">Источники</button><div class="menu" id="menuSrc"></div></div>
      <div class="dd" id="ddFlt"><button class="btn" type="button" id="btnFlt">Фильтры</button>
        <div class="menu">
          <label><input type="checkbox" data-f="disc"> Со скидкой</label>
          <label><input type="checkbox" data-f="nop"> Нет цены</label>
          <label><input type="checkbox" data-f="above"> Выше РРЦ</label>
        </div>
      </div>
      <span class="count" id="cnt"></span>
      <button class="reset" id="reset" hidden>Сбросить</button>
    </div>
    <div class="cluster">
      <div class="seg" id="seg"></div>
      <span class="range" id="range"><input type="date" id="d1"><span>—</span><input type="date" id="d2"></span>
      <button class="btn" id="alerts" type="button"></button>
      <button class="btn" id="exp" type="button">Экспорт</button>
    </div>
  </div>

  <div class="scroll" id="scroll"><table id="tbl"></table></div>
  <div class="legend"><span>ниже РРЦ</span><div class="bar2" id="lg"></div><span>выше РРЦ</span><span>· белая ячейка = цена равна РРЦ · серая = нет цены · зачёркнуто = базовая цена до скидки</span></div>
</div>
<div id="tip"></div>

<script>
/* ================== ДАННЫЕ ==================
   Единственное место, которое меняется при подключении реальной базы.
   Возвращает { demo, channels, dates, items }:
   channels: [{id, name}]
   dates:    ['YYYY-MM-DD', ...]  (по возрастанию, последняя = сегодня)
   items:    [{sku, title, rrp, prices:{[channelId]:[ {p, base?} | null, ... по dates ]}}]
   Ниже — ДЕМО: цены сгенерированы, это не реальные данные.             */
const DAYS_MAX = 90;
async function loadData(){
  const channels=[{id:'wb',name:'WB'},{id:'ozon',name:'Ozon'},{id:'lamoda',name:'Lamoda'},{id:'zya',name:'ЗЯ'}];
  const products=[
["112500","Hydro Nourishing Moisture Shampoo, 800 ml / 27 fl oz",6760],["112501","Hydro Nourishing Moisture Shampoo, 250 ml / 8.45 fl oz",3585],["112503","Hydro Intensive Repair Shampoo, 250 ml / 8.45 fl oz",3585],["112506","Hydro Nutrient Nourishing Conditioner, 250 ml / 8.45 fl oz",3679],["112507","Hydro Nutrient Nourishing Conditioner, 800 ml / 27 fl oz",6959],["112510","Hydro Deep Repair Hair Treatment, 500 ml / 16.9 fl oz",6293],["112511","Hydro Deep Repair Hair Treatment, 250 ml / 8.45 fl oz",3814],["112516","Hydro Miracle Hair Serum, 110 ml / 3.7 fl oz",3169],["112525","Liquid Silk Shampoo, 250 ml / 8.45 fl oz",3474],["112526","Liquid Silk Shampoo, 800 ml / 27 fl oz",7844],["112527","Liquid Silk Conditioner, 250 ml / 8.45 fl oz",3871],["112528","Liquid Silk Conditioner, 800 ml / 27 fl oz",8048],["112529","Liquid Silk Oil, 60 ml / 2.0 fl oz",3515],["112530","Hydro Liquid Silk Treatment, 500 ml / 16.91 fl oz",6000],["112537","Detox Therapy Shampoo, 250 ml / 8.45 fl oz",3566],["112538","Detox Therapy Shampoo, 800 ml / 27 fl oz",7131],["112539","Detox Therapy Scalp Peeling, 100 ml / 3.38 fl oz",3056],["112540","Detox Therapy Scalp Tonic, 60 ml / 2.03 fl oz",2038],["112543","Detox Therapy Scalp Scrub, 50 g / 1.76 oz",938],["112544","Detox Therapy Shampoo, 50 ml / 1.69 fl oz",1000],["112545","Golden Hour Shampoo, 50 ml / 1.69 fl oz",1000],["112546","Liquid Silk Shampoo, 50 ml / 1.69 fl oz",1000],["112548","Hydro Liquid Silk Treatment, 50 ml / 1.69 fl oz",1000],["112550","Hydro Nourishing Moisture Shampoo, 50 ml / 1.69 fl oz",940],["112551","Hydro Nutrient Nourishing Conditioner, 50 ml / 1.69 fl oz",1000],["112553","Hydro Intensive Repair Shampoo, 50 ml / 1.69 fl oz",940],["112554","Hydro Deep Repair Hair Treatment, 50 ml / 1.69 fl oz",940],["112556","Blonde Code Toning Conditioner, 250 ml / 8.45 fl oz",4075],["112557","Blonde Code Color Lock Hair Mask, 250 ml / 8.45 fl oz",3770],["112558","Blonde Code Toning Shampoo, 250 ml / 8.45 fl oz",3872],["112559","Blonde Code Toning Shampoo, 50 ml / 1.69 fl oz",1000],["112560","Blonde Code Color Lock Hair Mask, 50 ml / 1.69 fl oz",1000],["112561","Blonde Code Toning Conditioner, 50 ml / 1.69 fl oz",1000],["150002","Hydro Root Strengthening Shampoo, 800 ml / 27 fl oz",7459],["179000","Detox Therapy Scalp Scrub, 150 g / 5.29 oz",3056],["202401","Molecular Hair Cream All in One, 200 ml / 6.76 fl oz",4788],["202402","Golden Hour Hair Mask, 280 ml / 9.47 fl oz",4992],["202403","Softening Microcapsules Hair Mask, 280 ml / 9.47 fl oz",4992],["202405","Golden Hour Shampoo, 250 ml / 8.45 fl oz",3744],["202406","Golden Hour Shampoo, 800 ml / 27 fl oz",7437],["202407","Microcapsules Shampoo, 250 ml / 8.45 fl oz",3744],["202408","Microcapsules Shampoo, 800 ml / 27 fl oz",7437],["632187","Hydro Liquid Silk Treatment, 300 ml / 10.14 fl oz",4569]];
  const today=new Date(); today.setHours(12,0,0,0);
  const dates=[]; for(let i=DAYS_MAX-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);dates.push(d.toISOString().slice(0,10));}
  let seed=20261020; const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
  const items=products.map(([sku,title,rrp])=>{
    const prices={};
    channels.forEach(ch=>{
      let k=0.82+rnd()*0.36, hasData=rnd()>0.07, out=[];
      for(let i=0;i<DAYS_MAX;i++){
        if(rnd()<0.12) k+= (rnd()-0.5)*0.08;
        k=Math.min(1.25,Math.max(0.7,k));
        if(!hasData || (rnd()<0.01)){out.push(null);continue;}
        let p=Math.round(rrp*k/10)*10;
        if(rnd()<0.18) p=rrp;
        const disc=rnd()<0.14;
        out.push(disc?{p:Math.round(p*0.9/10)*10,base:p}:{p});
      }
      prices[ch.id]=out;
    });
    return {sku,title,rrp,prices};
  });
  return {demo:true,channels,dates,items};
}

/* ================== ЛОГИКА ================== */
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('ru-RU').replace(/ /g,' ');
const STOPS=[[0,[76,175,106]],[.25,[168,207,74]],[.5,[242,216,75]],[.75,[242,154,61]],[1,[224,70,60]]];
function scale(t){t=Math.min(1,Math.max(0,t));for(let i=1;i<STOPS.length;i++){if(t<=STOPS[i][0]){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i],u=(t-a)/(b-a);return ca.map((v,j)=>Math.round(v+(cb[j]-v)*u));}}return STOPS[4][1];}
const lum=c=>(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
const fmtDate=s=>s.slice(8,10)+'.'+s.slice(5,7);
const pct=(a,b)=>((a/b-1)*100);
const sgn=v=>(v>0?'+':'')+v.toFixed(1).replace('.',',')+'%';

const S={data:null,q:'',src:new Set(),flt:{disc:false,nop:false,above:false},period:'1',from:null,to:null,sort:null,onlyAlerts:false};
const PERIODS=[['1','Сегодня'],['7','7 дней'],['14','14 дней'],['30','30 дней'],['90','90 дней'],['custom','Custom range']];

function visibleIdx(){
  const n=S.data.dates.length;
  if(S.period==='custom'){
    const a=S.from?S.data.dates.indexOf(S.from):-1, b=S.to?S.data.dates.indexOf(S.to):-1;
    const i0=a>=0?a:0, i1=b>=0?b:n-1; const out=[];for(let i=Math.min(i0,i1);i<=Math.max(i0,i1);i++)out.push(i);return out;
  }
  const k=+S.period; const out=[];for(let i=n-k;i<n;i++)out.push(i);return out;
}
const cellAt=(it,ch,i)=>it.prices[ch][i];
function lastChange(it,ch){const n=S.data.dates.length,c=it.prices[ch][n-1],p=it.prices[ch][n-2];return c&&p?pct(c.p,p.p):null;}

function rowsFiltered(idx){
  const q=S.q.trim().toLowerCase(), last=S.data.dates.length-1;
  return S.data.items.filter(it=>{
    if(q&&!(it.title.toLowerCase().includes(q)||it.sku.includes(q)))return false;
    const chs=[...S.src];
    if(S.flt.disc&&!chs.some(ch=>idx.some(i=>cellAt(it,ch,i)?.base)))return false;
    if(S.flt.nop&&!chs.some(ch=>idx.some(i=>!cellAt(it,ch,i))))return false;
    if(S.flt.above&&!chs.some(ch=>idx.some(i=>{const c=cellAt(it,ch,i);return c&&c.p>it.rrp;})))return false;
    if(S.onlyAlerts&&!chs.some(ch=>{const v=lastChange(it,ch);return v!==null&&Math.abs(v)>=5;}))return false;
    return true;
  });
}
function alertCount(){let n=0;S.data.items.forEach(it=>S.data.channels.forEach(ch=>{if(S.src.has(ch.id)){const v=lastChange(it,ch.id);if(v!==null&&Math.abs(v)>=5)n++;}}));return n;}

function render(){
  const D=S.data, idx=visibleIdx(), chans=D.channels.filter(c=>S.src.has(c.id));
  let rows=rowsFiltered(idx);
  if(S.sort){
    const {key,dir}=S.sort;
    const val=it=>key==='rrp'?it.rrp:(()=>{const c=it.prices[key.ch][key.i];return c?c.p:null;})();
    rows=[...rows].sort((a,b)=>{const x=val(a),y=val(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return (x-y)*dir;});
  }
  // шкала: min/max отношения цена/РРЦ по видимым ячейкам
  let mn=Infinity,mx=-Infinity;
  rows.forEach(it=>chans.forEach(ch=>idx.forEach(i=>{const c=cellAt(it,ch.id,i);if(c){const r=c.p/it.rrp;if(r<mn)mn=r;if(r>mx)mx=r;}})));
  const span=mx-mn||1;

  const arr=(k)=>S.sort&&JSON.stringify(S.sort.key)===JSON.stringify(k)?`<span class="arr">${S.sort.dir>0?'▲':'▼'}</span>`:'';
  let h='<thead><tr><th class="c-prod"></th><th class="c-rrp"></th>';
  chans.forEach(ch=>{h+=`<th class="ch" colspan="${idx.length}">${ch.name}</th>`;});
  h+='</tr><tr class="dates"><th class="c-prod"></th><th class="c-rrp rrph" data-sort="rrp">РРЦ, ₽'+arr('rrp')+'</th>';
  chans.forEach(ch=>idx.forEach((i,j)=>{h+=`<th class="dt${j===0?' first':''}" data-ch="${ch.id}" data-i="${i}">${fmtDate(D.dates[i])}${arr({ch:ch.id,i})}</th>`;}));
  h+='</tr></thead><tbody>';
  if(!rows.length)h+=`<tr><td colspan="${2+chans.length*idx.length}" class="empty">Ничего не найдено</td></tr>`;
  rows.forEach(it=>{
    const hue=[...it.title.split(' ')[0]].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
    h+=`<tr><td class="c-prod"><div class="prod"><div class="sw" style="background:hsl(${hue} 22% 82%)"></div><div class="pt"><b title="${it.title}">${it.title}</b><i>${it.sku}</i></div></div></td><td class="c-rrp">${fmt(it.rrp)}</td>`;
    chans.forEach(ch=>idx.forEach((i,j)=>{
      const c=cellAt(it,ch.id,i), g=j===0?' gstart':'';
      if(!c){h+=`<td class="cell none${g}" data-s="${it.sku}" data-ch="${ch.id}" data-i="${i}">—</td>`;return;}
      if(c.p===it.rrp&&!c.base){h+=`<td class="cell eq${g}" data-s="${it.sku}" data-ch="${ch.id}" data-i="${i}">${fmt(c.p)}</td>`;return;}
      const col=scale((c.p/it.rrp-mn)/span), fg=lum(col)<0.5?'#fff':'#1f1f1f';
      h+=`<td class="cell${g}" style="background:rgb(${col});color:${fg}" data-s="${it.sku}" data-ch="${ch.id}" data-i="${i}">${fmt(c.p)}${c.base?`<s>${fmt(c.base)}</s>`:''}</td>`;
    }));
    h+='</tr>';
  });
  $('#tbl').innerHTML=h+'</tbody>';
  $('#cnt').textContent=`${rows.length} из ${D.items.length}`;
  const dirty=S.q||S.flt.disc||S.flt.nop||S.flt.above||S.onlyAlerts||S.src.size!==D.channels.length;
  $('#reset').hidden=!dirty;
  $('#btnSrc').textContent='Источники · '+S.src.size;
  const nf=Object.values(S.flt).filter(Boolean).length;
  $('#btnFlt').textContent='Фильтры'+(nf?' · '+nf:'');
  $('#btnFlt').classList.toggle('on',nf>0);
  const ac=alertCount(); const ab=$('#alerts'); ab.textContent='Алерты · '+ac; ab.classList.toggle('on',S.onlyAlerts);
  $('#lg').style.background='linear-gradient(90deg,'+STOPS.map(([t,c])=>`rgb(${c}) ${t*100}%`).join(',')+')';
}

function init(D){
  S.data=D; D.channels.forEach(c=>S.src.add(c.id));
  $('#demoTag').hidden=!D.demo;
  $('#seg').innerHTML=PERIODS.map(([k,l])=>`<button data-p="${k}" class="${k===S.period?'active':''}">${l}</button>`).join('');
  $('#menuSrc').innerHTML='<div class="hint">Минимум один источник</div>'+D.channels.map(c=>`<label><input type="checkbox" data-src="${c.id}" checked> ${c.name==='ЗЯ'?'Золотое Яблоко':c.name==='WB'?'Wildberries':c.name}</label>`).join('');
  $('#d1').min=$('#d2').min=D.dates[0]; $('#d1').max=$('#d2').max=D.dates[D.dates.length-1];

  $('#q').addEventListener('input',e=>{S.q=e.target.value;render();});
  document.addEventListener('click',e=>{
    const dd=e.target.closest('.dd');
    document.querySelectorAll('.dd').forEach(x=>{if(x!==dd)x.classList.remove('open');});
    if(dd&&e.target.closest('.btn'))dd.classList.toggle('open');
  });
  $('#menuSrc').addEventListener('change',e=>{
    const id=e.target.dataset.src; if(!id)return;
    if(e.target.checked)S.src.add(id); else if(S.src.size>1)S.src.delete(id); else e.target.checked=true;
    render();
  });
  $('#ddFlt').addEventListener('change',e=>{const f=e.target.dataset.f;if(f){S.flt[f]=e.target.checked;render();}});
  $('#seg').addEventListener('click',e=>{
    const p=e.target.dataset.p; if(!p)return; S.period=p; S.sort=null;
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
    $('#range').classList.toggle('show',p==='custom'); render();
  });
  $('#d1').addEventListener('change',e=>{S.from=e.target.value;render();});
  $('#d2').addEventListener('change',e=>{S.to=e.target.value;render();});
  $('#alerts').addEventListener('click',()=>{S.onlyAlerts=!S.onlyAlerts;render();});
  $('#reset').addEventListener('click',()=>{
    S.q='';$('#q').value='';S.onlyAlerts=false;Object.keys(S.flt).forEach(k=>S.flt[k]=false);
    document.querySelectorAll('[data-f]').forEach(c=>c.checked=false);
    D.channels.forEach(c=>S.src.add(c.id));document.querySelectorAll('[data-src]').forEach(c=>c.checked=true);render();
  });
  $('#tbl').addEventListener('click',e=>{
    const th=e.target.closest('th[data-sort],th.dt'); if(!th)return;
    const key=th.dataset.sort==='rrp'?'rrp':{ch:th.dataset.ch,i:+th.dataset.i};
    const same=S.sort&&JSON.stringify(S.sort.key)===JSON.stringify(key);
    S.sort=same?(S.sort.dir>0?{key,dir:-1}:null):{key,dir:1}; render();
  });
  // tooltip
  const tip=$('#tip');
  $('#tbl').addEventListener('mousemove',e=>{
    const td=e.target.closest('td.cell'); if(!td){tip.style.display='none';return;}
    const it=D.items.find(x=>x.sku===td.dataset.s), i=+td.dataset.i, ch=td.dataset.ch, c=it.prices[ch][i];
    const name=D.channels.find(x=>x.id===ch).name;
    let t=`<b>${it.sku}</b> · ${name} · ${fmtDate(D.dates[i])}<br>`;
    if(!c)t+='<span class="m">нет цены</span>';
    else{
      t+=`${fmt(c.p)} ₽ · к РРЦ ${sgn(pct(c.p,it.rrp))}`;
      if(c.base)t+=`<br><span class="m">базовая ${fmt(c.base)} ₽ · скидка ${Math.round((1-c.p/c.base)*100)}%</span>`;
      const pv=i>0?it.prices[ch][i-1]:null;
      t+=`<br><span class="m">к пред. дню: ${pv?sgn(pct(c.p,pv.p)):'—'}</span>`;
    }
    tip.innerHTML=t; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px'; tip.style.top=(e.clientY+14)+'px';
  });
  $('#tbl').addEventListener('mouseleave',()=>tip.style.display='none');
  $('#exp').addEventListener('click',()=>{
    const idx=visibleIdx(),chans=D.channels.filter(c=>S.src.has(c.id)),rows=rowsFiltered(idx);
    const head=['SKU','Название','РРЦ'];chans.forEach(c=>idx.forEach(i=>head.push(c.name+' '+D.dates[i])));
    const lines=[head].concat(rows.map(it=>{const r=[it.sku,'"'+it.title+'"',it.rrp];chans.forEach(c=>idx.forEach(i=>{const x=it.prices[c.id][i];r.push(x?x.p:'');}));return r;}));
    const blob=new Blob(['﻿'+lines.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hadat-prices.csv';a.click();URL.revokeObjectURL(a.href);
  });
  render();
}
loadData().then(init);
</script>
</body>
